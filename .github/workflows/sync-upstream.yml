name: Sync upstream main

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'taavie-z/openfilm' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync main from the upstream repository
        env:
          # Fine-grained PAT: this repository only, Contents and Workflows read/write.
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          GH_REPO: taavie-z/openfilm
        # GitHub merges upstream changes without discarding fork commits; conflicts fail the run.
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add the FORK_SYNC_TOKEN repository secret with Contents and Workflows read/write permissions for this fork."
            exit 1
          fi
          gh api --method POST "repos/${GH_REPO}/merge-upstream" -f branch=main
